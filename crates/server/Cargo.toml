[package]
name = "baradwatchu-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
serde.workspace = true
tokio.workspace = true
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize", "fast"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
url = "2"
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

